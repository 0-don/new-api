# Swarm stack: the new-api APP instances (master + slave) only. Datastores
# (postgres/redis/pgbackup/logrotate) stay in docker-compose-traefik.yml as plain
# compose singletons - swarm scales apps, not the DB. Deploy with:
#   docker stack deploy -c docker-stack-traefik.yml --resolve-image never newapi
#
# Two services because the app requires EXACTLY ONE master: NODE_TYPE unset =
# master (runs DB migration + all scheduled jobs, gated on common.IsMasterNode);
# NODE_TYPE=slave skips both and just serves API + relay + web. Identical swarm
# replicas cannot express that, so master is its own replicas:1 service and the
# slave is a separate service (bump its replicas for more standing capacity).
#
# Traefik load-balances the two via a file-provider WRR (traefik dynamic/
# newapi-wrr.yml) that references newapi-master@swarm + newapi-slave@swarm. The
# HTTP router lives in that file, NOT here - two services declaring the same
# router label would collide. Here each service only publishes itself as a plain
# LB service (server.port + healthcheck.path) under deploy.labels (swarm reads
# labels from deploy, not the container).
version: "3.8"

x-newapi-app: &newapi-app
  image: unorouter-new-api:latest
  # Wait for a stream silent 30 min between tokens before reaping; no wall-clock cap.
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/status"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s
  networks:
    - newapi-overlay
  # Bind mounts so both /data and the logs are host-visible for easy access
  # (ls/tail the logs, rsync /data on migration). `docker stack deploy` does NOT
  # expand `~`, so the path must be absolute; CI sets NEWAPI_HOST_DIR=$HOME/new-api
  # instead of hardcoding a user home, so it works on any box/user.
  volumes:
    - ${NEWAPI_HOST_DIR}/data:/data
    - ${NEWAPI_HOST_DIR}/logs:/app/logs
  logging:
    driver: json-file
    options:
      max-size: "10g"
      max-file: "5"

x-newapi-env: &newapi-env
  SQL_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@unorouter-new-api-postgres:5432/${POSTGRES_DB}
  REDIS_CONN_STRING: redis://unorouter-new-api-redis
  TZ: Europe/Berlin
  SESSION_SECRET: ${SESSION_SECRET}
  CRYPTO_SECRET: ${CRYPTO_SECRET}
  SMTP_BCC: ${SMTP_BCC}
  ERROR_LOG_ENABLED: "true"
  DEBUG: "true"
  BATCH_UPDATE_ENABLED: "false"
  MEMORY_CACHE_ENABLED: "false"
  # DB-poll cache coherence (no pub/sub); 15s keeps the slave's channel/option/authz
  # caches fresh soon after a master change.
  SYNC_FREQUENCY: "15"
  GIN_MODE: release
  ENABLE_OPENAPI: "true"
  DEFAULT_LANGUAGE: en
  RELAY_TIMEOUT: "0"
  STREAMING_TIMEOUT: "1800"
  GLOBAL_API_RATE_LIMIT_ENABLE: "false"
  SEARCH_RATE_LIMIT_ENABLE: "false"
  CRITICAL_RATE_LIMIT: "10000"
  OAUTH_ALLOWED_REDIRECT_ORIGINS: https://unorouter.com,http://localhost:3000
  OAUTH_SERVER_ENABLED: "true"
  OAUTH_ISSUER_URL: https://api.unorouter.com
  ENABLE_PPROF: "true"

x-newapi-deploy: &newapi-deploy
  replicas: 1
  # start-first: swarm boots the replacement task and waits for it to pass the
  # container healthcheck BEFORE stopping the old one -> zero-downtime rolling.
  update_config:
    order: start-first
    parallelism: 1
    failure_action: rollback
  rollback_config:
    order: start-first
  restart_policy:
    condition: any

services:
  # MASTER: migrates the DB + runs every scheduled job. NODE_TYPE unset = master.
  newapi-master:
    <<: *newapi-app
    command: --log-dir /app/logs/master
    environment:
      <<: *newapi-env
    deploy:
      <<: *newapi-deploy
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=newapi-overlay"
        - "traefik.http.services.newapi-master.loadbalancer.server.port=3000"
        - "traefik.http.services.newapi-master.loadbalancer.healthcheck.path=/api/status"
        - "traefik.http.services.newapi-master.loadbalancer.healthcheck.interval=2s"
        - "traefik.http.services.newapi-master.loadbalancer.healthcheck.timeout=3s"
        # Fast dial timeout so a dead task IP fails fast -> retry redispatches (see WRR file).
        - "traefik.http.services.newapi-master.loadbalancer.serverstransport=newapi-fast@file"

  # SLAVE: serves API + relay + web; skips migration + scheduled jobs via NODE_TYPE.
  # Bump replicas for more standing capacity - all slaves are interchangeable.
  newapi-slave:
    <<: *newapi-app
    command: --log-dir /app/logs/slave
    environment:
      <<: *newapi-env
      NODE_TYPE: slave
    deploy:
      <<: *newapi-deploy
      # 2 replicas so the slave service ALWAYS has a live task: during its own
      # start-first roll one stays serving while the other reboots, and during the
      # MASTER roll (single task, briefly dark) these two carry all traffic. This
      # is what closes the last per-service swap gap the retry middleware alone
      # can't (a single-replica child goes fully dark for ~1 request mid-swap).
      replicas: 2
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=newapi-overlay"
        - "traefik.http.services.newapi-slave.loadbalancer.server.port=3000"
        - "traefik.http.services.newapi-slave.loadbalancer.healthcheck.path=/api/status"
        - "traefik.http.services.newapi-slave.loadbalancer.healthcheck.interval=2s"
        - "traefik.http.services.newapi-slave.loadbalancer.healthcheck.timeout=3s"
        - "traefik.http.services.newapi-slave.loadbalancer.serverstransport=newapi-fast@file"

networks:
  # Single overlay for everything: Traefik reaches the app task IPs here, and the
  # app reaches postgres/redis (plain-compose containers attached to this same
  # --attachable overlay) by container name. A local bridge cannot carry
  # swarm-service traffic, so one shared overlay replaces the old internal bridge.
  newapi-overlay:
    external: true

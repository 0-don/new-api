name: unorouter-new-api

# Plain-compose DATASTORES + sidecars for new-api. The APP instances (master +
# slave) live in docker-stack-traefik.yml as a Swarm stack (native replicas +
# start-first rolling behind Traefik). These services are singletons - postgres,
# redis, their backup, and the log-pruner - so they stay plain compose and are
# NOT scaled. Bring them up (cold-start safe) with:
#   docker compose -f docker-compose-traefik.yml up -d --wait \
#     unorouter-new-api-postgres unorouter-new-api-redis
#   docker compose -f docker-compose-traefik.yml up -d   # backup + logrotate
# The swarm app stack reaches postgres/redis over the `internal` network (shared
# external) and Traefik over the `newapi-overlay` overlay.

networks:
  # Overlay shared with Traefik + the swarm app stack. Created --attachable in CI
  # (docker network create --driver overlay --attachable newapi-overlay). Declared
  # external here so a `compose up` never tries to recreate it as a bridge.
  newapi-overlay:
    external: true
  # App<->datastore bridge. name is fixed so the swarm stack can attach to it as
  # `unorouter-new-api_internal` (compose prefixes with the project name).
  internal:
    driver: bridge
    name: unorouter-new-api_internal

services:
  # Prune the app's own file logs so ~/new-api/logs never fills the disk. new-api
  # writes a fresh oneapi-<ts>.log every few minutes via --log-dir and never
  # deletes old ones; this sidecar shares the same volume and removes files older
  # than LOG_RETENTION_DAYS on an hourly loop. Recursive find covers the swarm
  # apps' master/ + slave/ subdirs. Lives in compose so it survives a server
  # migration (no host cron to forget).
  unorouter-new-api-logrotate:
    image: alpine:latest
    container_name: unorouter-new-api-logrotate
    restart: always
    environment:
      - LOG_RETENTION_DAYS=4
    volumes:
      - ~/new-api/logs:/app/logs
    command: >
      sh -c 'while true; do
        find /app/logs -name "oneapi-*.log" -type f -mtime +$${LOG_RETENTION_DAYS} -delete 2>/dev/null || true;
        sleep 3600;
      done'
    networks:
      - internal

  unorouter-new-api-redis:
    image: redis:latest
    container_name: unorouter-new-api-redis
    restart: always
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  unorouter-new-api-postgres:
    image: postgres:15
    container_name: unorouter-new-api-postgres
    restart: always
    networks:
      - internal
    ports:
      - 5439:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - unorouter_pg_data:/var/lib/postgresql/data
    # Gate the swarm app tasks on a READY database. On a cold/fresh server postgres
    # runs initdb for ~5-10s; the CI `--wait` on this healthcheck blocks the stack
    # deploy until pg_isready flips healthy, so the master never boots into a
    # migration against a not-yet-accepting database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  unorouter-new-api-pgbackup:
    image: prodrigestivill/postgres-backup-local:15-alpine
    container_name: unorouter-new-api-pgbackup
    restart: always
    networks:
      - internal
    volumes:
      - ~/duplicati-volume/source/unorouter-new-api-pgbackup:/backups
    depends_on:
      - unorouter-new-api-postgres
    environment:
      - POSTGRES_HOST=unorouter-new-api-postgres
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_EXTRA_OPTS=-Fc
      - SCHEDULE=0 0,12 * * *
      - BACKUP_KEEP_MINS=1440
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=0
      - HEALTHCHECK_PORT=8080

volumes:
  unorouter_pg_data:

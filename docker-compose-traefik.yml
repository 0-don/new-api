name: unorouter-new-api

networks:
  proxy:
    external: false
    name: proxy
  internal:
    driver: bridge

services:
  unorouter-new-api:
    build: .
    # image: calciumion/new-api-horizon:latest
    container_name: unorouter-new-api
    restart: always
    command: --log-dir /app/logs
    # Persist + cap the container stdout log (json-file): 200MB x 5 = ~1GB retained.
    # The app's own logs in ~/new-api/logs survive deploys; this keeps `docker logs`
    # from being unbounded or wiped without retention.
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - proxy
      - internal
    volumes:
      - ~/new-api/data:/data
      - ~/new-api/logs:/app/logs
    environment:
      - SQL_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@unorouter-new-api-postgres:5432/${POSTGRES_DB}
      - REDIS_CONN_STRING=redis://unorouter-new-api-redis
      - TZ=Europe/Berlin
      - SESSION_SECRET=${SESSION_SECRET}
      - CRYPTO_SECRET=${CRYPTO_SECRET}
      - SMTP_BCC=${SMTP_BCC}
      - ERROR_LOG_ENABLED=true
      - DEBUG=true
      - BATCH_UPDATE_ENABLED=false
      - MEMORY_CACHE_ENABLED=false
      - GIN_MODE=release
      - ENABLE_OPENAPI=true
      - DEFAULT_LANGUAGE=en # Backend language: en, zh-CN, zh-TW, fr, ja, ru, vi
      - RELAY_TIMEOUT=1800
      - STREAMING_TIMEOUT=1800
      - GLOBAL_API_RATE_LIMIT_ENABLE=false
      - SEARCH_RATE_LIMIT_ENABLE=false
      - CRITICAL_RATE_LIMIT=10000
      - OAUTH_ALLOWED_REDIRECT_ORIGINS=https://unorouter.com,http://localhost:3000
      # Agent-OAuth 2.1 server. Signing key auto-generates into /data on
      # first boot. Consent URL derives from the first entry in
      # OAUTH_ALLOWED_REDIRECT_ORIGINS. All other OAUTH_* vars have sensible
      # defaults — see .env.example for overrides.
      - OAUTH_SERVER_ENABLED=true
      - OAUTH_ISSUER_URL=https://api.unorouter.com
      - ENABLE_PPROF=true
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.newapi.rule=Host(`api.unorouter.com`)"
      - "traefik.http.routers.newapi.entrypoints=websecure"
      - "traefik.http.routers.newapi.tls.certresolver=letsencrypt"
      - "traefik.http.services.newapi.loadbalancer.server.port=3000"
    depends_on:
      - unorouter-new-api-redis
      - unorouter-new-api-postgres

  unorouter-new-api-redis:
    image: redis:latest
    container_name: unorouter-new-api-redis
    restart: always
    networks:
      - internal

  unorouter-new-api-postgres:
    image: postgres:15
    container_name: unorouter-new-api-postgres
    restart: always
    networks:
      - internal
    ports:
      - 5439:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - unorouter_pg_data:/var/lib/postgresql/data

  unorouter-new-api-pgbackup:
    image: prodrigestivill/postgres-backup-local:15-alpine
    container_name: unorouter-new-api-pgbackup
    restart: always
    networks:
      - internal
    volumes:
      - ~/duplicati-volume/source/unorouter-new-api-pgbackup:/backups
    depends_on:
      - unorouter-new-api-postgres
    environment:
      - POSTGRES_HOST=unorouter-new-api-postgres
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_EXTRA_OPTS=-Fc
      - SCHEDULE=0 0,12 * * *
      - BACKUP_KEEP_MINS=1440
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=0
      - HEALTHCHECK_PORT=8080

volumes:
  unorouter_pg_data:

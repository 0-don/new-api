name: Docker Prod

on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Create env file
        run: |
          echo DEBUG_CRYPTO_SECRET=${{ secrets.DEBUG_CRYPTO_SECRET }} > .env
          echo DEBUG_POSTGRES_DB=${{ secrets.DEBUG_POSTGRES_DB }} >> .env
          echo DEBUG_POSTGRES_PASSWORD=${{ secrets.DEBUG_POSTGRES_PASSWORD }} >> .env
          echo DEBUG_POSTGRES_USER=${{ secrets.DEBUG_POSTGRES_USER }} >> .env
          echo DEBUG_SESSION_SECRET=${{ secrets.DEBUG_SESSION_SECRET }} >> .env

          echo CRYPTO_SECRET=${{ secrets.CRYPTO_SECRET }} >> .env
          echo POSTGRES_DB=${{ secrets.POSTGRES_DB }} >> .env
          echo POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} >> .env
          echo POSTGRES_USER=${{ secrets.POSTGRES_USER }} >> .env
          echo SESSION_SECRET=${{ secrets.SESSION_SECRET }} >> .env
          echo SMTP_BCC=${{ secrets.SMTP_BCC }} >> .env

          echo ERROR_LOG_ENABLED=true >> .env

      # Zero-downtime HA via single-node Swarm. The app runs as a swarm stack
      # (newapi-master + newapi-slave); swarm's start-first update boots the new
      # task green BEFORE stopping the old one, and Traefik's file-provider WRR
      # keeps routing to whichever child is healthy - no deploy 404 window. The
      # datastores stay plain compose (singletons, not scaled).

      # Idempotent: init swarm on the host if it isn't already a manager. No-op on
      # every subsequent deploy.
      - name: Ensure swarm active
        run: docker info --format '{{.Swarm.LocalNodeState}}' | grep -q active || docker swarm init

      # Overlay shared by Traefik + the app stack. --attachable so the standalone
      # Traefik container can join it and reach the swarm task IPs. Ignore the
      # "already exists" error on redeploys.
      - name: Ensure overlay network
        run: docker network create --driver overlay --attachable newapi-overlay 2>/dev/null || true

      # Datastores first, BLOCK until healthy (--wait). On a cold/fresh server
      # postgres runs initdb for ~5-10s; this gate means the master never stack-
      # deploys into a migration against a not-yet-accepting DB. Idempotent.
      - name: Ensure datastores healthy (cold-start safe)
        run: docker compose -f docker-compose-traefik.yml up -d --wait --wait-timeout 120 unorouter-new-api-postgres unorouter-new-api-redis

      - name: Ensure support services
        run: docker compose -f docker-compose-traefik.yml up -d unorouter-new-api-pgbackup unorouter-new-api-logrotate

      # Build the app image locally and tag it exactly as the stack references it.
      # Single node -> no registry push needed (all tasks land on this host and see
      # the local image). NOTE: if a 2nd swarm node is ever added, this MUST push
      # to a registry - a remote node cannot see a locally-built image.
      - name: Build app image
        run: docker build -t unorouter-new-api:latest .

      # start-first rolling: swarm brings up the new master task, waits for its
      # container healthcheck, THEN stops the old one; then the slave. --resolve-
      # image never keeps the local tag (no registry lookup). --with-registry-auth
      # is unnecessary for a local image.
      - name: Deploy app stack (rolling)
        run: docker stack deploy -c docker-stack-traefik.yml --resolve-image never newapi

      # Swarm task containers are named newapi_<service>.<n>.<id>, NOT a fixed
      # container_name, so resolve by name filter. Wait for a running master +
      # slave task that answers /api/status.
      - name: Wait for master healthy
        run: |
          for i in $(seq 1 90); do
            cid=$(docker ps -q -f name=newapi_newapi-master -f health=healthy | head -1)
            if [ -n "$cid" ] && docker exec "$cid" wget -q -O /dev/null http://localhost:3000/api/status; then
              echo "master healthy"; exit 0
            fi
            echo "waiting for master... ($i)"; sleep 2
          done
          echo "master did not become healthy in time"; docker service ps newapi_newapi-master --no-trunc; exit 1

      - name: Wait for slave healthy
        run: |
          for i in $(seq 1 90); do
            cid=$(docker ps -q -f name=newapi_newapi-slave -f health=healthy | head -1)
            if [ -n "$cid" ] && docker exec "$cid" wget -q -O /dev/null http://localhost:3000/api/status; then
              echo "slave healthy"; exit 0
            fi
            echo "waiting for slave... ($i)"; sleep 2
          done
          echo "slave did not become healthy in time"; docker service ps newapi_newapi-slave --no-trunc; exit 1

      - name: Docker run debug
        run: docker compose -f docker-compose-debug.yml up -d --build

      - name: remove unused images, containers, volumes, and networks
        run: docker image prune -a -f --filter "until=24h" && docker container prune -f --filter "until=24h" && docker volume prune -f && docker network prune -f --filter "until=24h"
